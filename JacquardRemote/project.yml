name: JacquardRemote
options:
  bundleIdPrefix: com.jamierytlewski
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  JacquardSDK:
    path: ../JacquardSDKiOS
targets:
  JacquardRemote:
    type: application
    platform: iOS
    sources:
      - JacquardRemote
    dependencies:
      - package: JacquardSDK
    info:
      path: JacquardRemote/Info.plist
      properties:
        CFBundleDisplayName: Jacquard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Jacquard connects to the tag in your jacket over Bluetooth so your sleeve can control your phone.
        NSAppleMusicUsageDescription: Jacquard controls Apple Music playback and reads what's playing when you ask your sleeve.
        NSCameraUsageDescription: Sleeve Camera lets you take photos and videos with a double tap on your jacket cuff.
        NSMicrophoneUsageDescription: Sleeve Camera records sound with your videos.
        NSPhotoLibraryAddUsageDescription: Photos and videos from Sleeve Camera are saved to your library.
        UIBackgroundModes: [bluetooth-central, audio]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.jamierytlewski.JacquardRemote
            CFBundleURLSchemes: [jacquard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierytlewski.JacquardRemote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  JacquardRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JacquardRemoteTests
    dependencies:
      - target: JacquardRemote
      - package: JacquardSDK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  JacquardRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - JacquardRemoteUITests
    dependencies:
      - target: JacquardRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  JacquardRemote:
    build:
      targets:
        JacquardRemote: all
        JacquardRemoteTests: [test]
        JacquardRemoteUITests: [test]
    test:
      targets:
        - JacquardRemoteTests
        - JacquardRemoteUITests
